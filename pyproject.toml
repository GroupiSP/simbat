[project]
name = "simbat"
version = "0.1.0"
description = "Monte Carlo battery simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pandas<3.0.0",
    "scipy>=1.16.3",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.152.4",
    "pytest>=9.0.3",
]
